name: CI

on:
  push:
    branches: [main, upgrade-2026]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (unit tests, API smoke test, reminders)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/nn_ci
      JWT_SECRET: ci-secret
      PORT: "4100"
      REMINDERS: "off"
      API_URL: http://localhost:4100
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Seed and start the API
        run: |
          node server/scripts/seed.js
          node server/server.js &
          for i in $(seq 1 30); do curl -sf "$API_URL/health" && break; sleep 1; done
      - run: npm run smoke
      - run: npm run check:reminders

  client:
    name: Client (types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End-to-end (Playwright and axe)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      E2E_MONGO_URI: mongodb://127.0.0.1:27017/nn_e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
